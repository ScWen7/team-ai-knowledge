[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "team-ai-knowledge-kit"
version = "0.7.0"
description = "Deterministic local toolkit for a Git-based team AI knowledge base"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
team-wiki = "team_wiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
team_wiki = ["knowledge_core/*.mjs"]
