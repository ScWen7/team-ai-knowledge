name: inbox-triage

on:
  push:
    paths:
      - 'sources/inbox/**'

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Detect new inbox files
        id: files
        run: |
          # 只看本次 push 新增/修改的 inbox 文件
          git diff --name-status --diff-filter=A "${{ github.event.before }}" "${{ github.sha }}" \
            | awk '$1=="A" && $2 ~ /^sources\/inbox\// {print $2}' > /tmp/new_inbox.txt || true
          if [ ! -s /tmp/new_inbox.txt ]; then
            echo "none=true" >> "$GITHUB_OUTPUT"
          else
            echo "none=false" >> "$GITHUB_OUTPUT"
            cat /tmp/new_inbox.txt
          fi

      - name: Create ingest reminder issue
        if: steps.files.outputs.none == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = fs.readFileSync('/tmp/new_inbox.txt', 'utf8')
              .split('\n').filter(x => x.trim());
            const list = files.map(f => `- \`${f}\``).join('\n');
            const body = [
              '检测到 `sources/inbox/` 新增资料，请值日工程师或 Agent 执行登记：',
              '',
              list,
              '',
              '## 处理步骤',
              '',
              '```bash',
              '# 对每份新资料执行（示例）',
              'team-wiki ingest . sources/inbox/<file> --title "<资料标题>"',
              'team-wiki index .',
              '```',
              '',
              '登记完成后：',
              '1. 资料会被移到 `sources/YYYY/MM/SRC-xxxx-主题/`',
              '2. 关闭本 issue',
              '',
              '## 如果不需要登记',
              '如果该资料不应进入知识库，请直接删除文件并关闭本 issue，附上原因。',
              '',
              '---',
              `触发 commit: ${process.env.GITHUB_SHA}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[inbox] ${files.length} 份新资料待登记`,
              body,
              labels: ['knowledge-triage'],
            });
