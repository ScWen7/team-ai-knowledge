name: one-off-member-first-transfer

on:
  push:
    branches: [fix/member-first-complete]
    paths:
      - '.maintenance/**'
      - '.github/workflows/apply-member-first.yml'

permissions:
  contents: write

jobs:
  validate-and-export-tree:
    if: github.repository == 'ScWen7/team-ai-knowledge' && github.ref == 'refs/heads/fix/member-first-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3de0af88aa92e0fd2ad6cde7a2635eaee38156e5
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct exact tested files
        run: python .maintenance/apply-member-first.py apply
      - name: Install in virtual environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Regression tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Synthetic member workflow
        run: .venv/bin/python scripts/check_member_workflow.py
      - name: Whitespace check
        run: git diff --check
      - name: Export verified source tree only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.error import HTTPError
          script = Path('.maintenance/apply-member-first.py').read_text()
          line = '        tree.append({"path": name, "mode": "100644", "type": "blob", "content": content.decode("utf-8")})'
          assert script.count(line) == 1
          script = script.replace(line, '        if not name.startswith(".github/workflows/"):\n    ' + line)
          namespace = {'__name__': 'transfer_helper'}
          exec(compile(script, '<verified-source-export>', 'exec'), namespace)
          try:
              namespace['upload'](namespace['manifest']())
          except HTTPError as exc:
              print('Git tree export failed:', exc.code, exc.read().decode())
              raise
          result = Path('/tmp/member-first-result.json')
          data = json.loads(result.read_text())
          data['workflow_omitted_for_connector'] = '.github/workflows/tests.yml'
          result.write_text(json.dumps(data, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: member-first-result
          path: /tmp/member-first-result.json
          retention-days: 3
